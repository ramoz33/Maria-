<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03010b">
<title>Maria Clara ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03010b}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=> {
const c=document.getElementById("c"),x=c.getContext("2d");
let W,H,D,stars=[],targets=[],phase="scatter",time=0,last=0,part=0;
const parts=["MARIA","CLARA"];

function resize(){
 D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);makeStars();
}
function r(a,b){return a+Math.random()*(b-a)}
function makeStars(){
 stars=[];let n=Math.max(240,Math.min(600,Math.floor(W*H/2400)));
 for(let i=0;i<n;i++)stars.push({x:r(0,W),y:r(0,H),vx:r(-.12,.12),vy:r(.03,.3),s:r(.7,2.1),q:r(0,6.28)});
}
function textPoints(txt){
 let o=document.createElement("canvas"),g=o.getContext("2d");
 let fs=Math.min(W*.21,118);o.width=W;o.height=fs*1.5;
 g.font="900 "+fs+"px Arial Black,Arial";g.textAlign="center";g.textBaseline="middle";
 g.fillText(txt,W/2,o.height/2);
 let a=g.getImageData(0,0,o.width,o.height).data,p=[],step=Math.max(3,Math.floor(fs/22));
 for(let yy=0;yy<o.height;yy+=step)for(let xx=0;xx<o.width;xx+=step)
  if(a[(yy*o.width+xx)*4+3]>120)p.push({x:xx,y:H*.43+yy-o.height*.5});
 return p;
}
function heartPoints(){
 let p=[],sc=Math.min(W,H)*.021;
 for(let i=0;i<900;i++){
  let t=r(0,6.283),q=r(.18,1);
  let xx=16*Math.sin(t)**3, yy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  p.push({x:W/2+xx*sc*q,y:H*.51+yy*sc*q});
 }
 return p;
}
function targetsFor(kind){return kind==="heart"?heartPoints():textPoints(parts[kind])}
function setTargets(kind){
 targets=targetsFor(kind);
 stars.forEach((s,i)=>{let p=targets[i%targets.length];s.tx=p.x;s.ty=p.y});
}
function frame(t){
 let dt=Math.min(40,t-last||16);last=t;time+=dt;
 x.fillStyle="rgba(3,1,11,.24)";x.fillRect(0,0,W,H);
 for(let s of stars){
  if(phase==="scatter"){s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.y>H+5)s.y=-5}
  let a=.3+.6*(.5+.5*Math.sin(t*.002+s.q));
  x.globalAlpha=a;x.shadowBlur=8;x.shadowColor="#d9e8ff";x.fillStyle="#fff";
  x.beginPath();x.arc(s.x,s.y,s.s,0,6.283);x.fill();
 }
 if(phase==="scatter"){
  if(time>900){phase="form";time=0;setTargets(part)}
 }else{
  let p=Math.min(1,time/1700),e=1-Math.pow(1-p,3);
  for(let s of stars){s.x+=(s.tx-s.x)*.045*e;s.y+=(s.ty-s.y)*.045*e}
  x.globalAlpha=1;
  for(let s of stars){
   let pulse=.7+.3*Math.sin(t*.004+s.q);
   x.shadowBlur=10+14*pulse;x.shadowColor=phase==="heart"?"#ff4f9a":"#d9e8ff";
   x.fillStyle=phase==="heart"?"#ffd4e6":"#fff";
   x.beginPath();x.arc(s.x,s.y,s.s*1.18,0,6.283);x.fill();
  }
  if(phase==="form"&&time>2900){phase="hold";time=0}
  else if(phase==="hold"&&time>1100){
   part++;
   if(part<2){phase="scatter";time=0}
   else{phase="heart";time=0;setTargets("heart")}
  }else if(phase==="heart"&&time>4300){part=0;phase="scatter";time=0}
 }
 x.shadowBlur=0;x.globalAlpha=1;requestAnimationFrame(frame);
}
addEventListener("resize",resize,{passive:true});resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
