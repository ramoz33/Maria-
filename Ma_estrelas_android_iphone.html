<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03010b">
<title>Ma ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03010b}
body{font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W=0,H=0,D=1,stars=[],targets=[];
  let phase="rise", phaseAt=0, started=false;

  const rand=(a,b)=>a+Math.random()*(b-a);

  function resize(){
    D=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=Math.floor(W*D);
    canvas.height=Math.floor(H*D);
    ctx.setTransform(D,0,0,D,0,0);
    if(started) prepareTargets();
  }
  addEventListener("resize",resize,{passive:true});
  resize();

  function makeStars(){
    const n=Math.max(260,Math.min(620,Math.floor(W*H/1900)));
    stars=[];
    for(let i=0;i<n;i++){
      stars.push({
        x:rand(0,W), y:rand(H,H*1.5),
        tx:W/2, ty:H/2,
        speed:rand(.35,1.15),
        size:rand(.6,2.2),
        phase:rand(0,Math.PI*2),
        vx:0,vy:0
      });
    }
  }

  function canvasTextPoints(ch){
    const off=document.createElement("canvas");
    off.width=Math.max(1,Math.floor(W));
    off.height=Math.max(1,Math.floor(H));
    const o=off.getContext("2d");
    const size=Math.min(W*.34,180);
    o.fillStyle="#fff";
    o.font="900 "+size+"px Arial";
    o.textAlign="center";
    o.textBaseline="middle";
    o.fillText(ch,W/2,H/2-10);
    const data=o.getImageData(0,0,off.width,off.height).data;
    const out=[];
    const step=Math.max(5,Math.floor(size/28));
    for(let y=0;y<H;y+=step)
      for(let x=0;x<W;x+=step)
        if(data[(y*off.width+x)*4+3]>100) out.push({x,y});
    return out;
  }

  function heartPoints(){
    const out=[];
    const scale=Math.min(W,H)/38;
    for(let i=0;i<300;i++){
      const t=Math.random()*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      const k=rand(.92,1.04);
      out.push({x:W/2+x*scale*k,y:H/2+y*scale*k});
    }
    return out;
  }

  function prepareTargets(){
    if(phase==="M") targets=canvasTextPoints("M");
    else if(phase==="a") targets=canvasTextPoints("a");
    else if(phase==="heart") targets=heartPoints();
    else targets=[];
    if(targets.length){
      stars.forEach((s,i)=>{
        const p=targets[i%targets.length];
        s.tx=p.x; s.ty=p.y;
      });
    }
  }

  function setPhase(p){
    phase=p;
    phaseAt=performance.now();
    prepareTargets();
  }

  function start(){
    started=true;
    makeStars();
    setPhase("rise");
  }

  function background(t){
    const g=ctx.createRadialGradient(W/2,H*.46,0,W/2,H*.46,Math.max(W,H)*.78);
    g.addColorStop(0,"#1b1034");
    g.addColorStop(.5,"#08051a");
    g.addColorStop(1,"#010107");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<100;i++){
      const x=(i*83.71)%W, y=(i*137.23)%H;
      ctx.globalAlpha=.08+.10*(.5+.5*Math.sin(t*.001+i));
      ctx.fillStyle="#fff";
      ctx.fillRect(x,y,1.2,1.2);
    }
    ctx.globalAlpha=1;
  }

  function particle(s,t,color="#fff"){
    const b=.5+.5*Math.sin(t*.004+s.phase);
    ctx.globalAlpha=.25+.7*b;
    ctx.shadowBlur=7+14*b;
    ctx.shadowColor=color;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size*(.8+.35*b),0,Math.PI*2);
    ctx.fill();
  }

  function frame(t){
    background(t);
    const e=t-phaseAt;

    if(phase==="rise"){
      stars.forEach(s=>{
        s.y-=s.speed;
        if(s.y<-10){s.y=H+rand(0,H*.3);s.x=rand(0,W);}
        particle(s,t,"#fff");
      });
      if(e>2200) setPhase("M");
    }

    else if(phase==="M"){
      stars.forEach(s=>{
        s.x+=(s.tx-s.x)*.055;
        s.y+=(s.ty-s.y)*.055;
        particle(s,t,"#fff");
      });
      if(e>3000) setPhase("a");
    }

    else if(phase==="a"){
      stars.forEach(s=>{
        s.x+=(s.tx-s.x)*.055;
        s.y+=(s.ty-s.y)*.055;
        particle(s,t,"#fff");
      });
      if(e>3000) setPhase("heart");
    }

    else if(phase==="heart"){
      stars.forEach(s=>{
        s.x+=(s.tx-s.x)*.065;
        s.y+=(s.ty-s.y)*.065;
        particle(s,t,"#ff9ed7");
      });

      const pulse=.5+.5*Math.sin(t*.003);
      ctx.save();
      ctx.translate(W/2,H/2-4);
      ctx.scale(1+pulse*.07,1+pulse*.07);
      ctx.font="900 "+Math.min(W*.23,145)+"px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.shadowBlur=22+pulse*22;
      ctx.shadowColor="#ff69bd";
      ctx.fillStyle="#ff9ed7";
      ctx.globalAlpha=.18;
      ctx.fillText("♥",0,0);
      ctx.globalAlpha=.9;
      ctx.fillText("♥",0,0);
      ctx.restore();

      // brilho final "Ma"
      ctx.save();
      ctx.font="700 "+Math.min(W*.11,54)+"px Arial";
      ctx.textAlign="center";
      ctx.fillStyle="#fff";
      ctx.shadowBlur=10;
      ctx.shadowColor="#fff";
      ctx.globalAlpha=.8;
      ctx.fillText("Ma",W/2,H*.78);
      ctx.restore();

      if(e>5200) start();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
    requestAnimationFrame(frame);
  }

  start();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
